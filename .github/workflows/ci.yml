# .github/workflows/ci.yml
# HayDevLegal — Phase 4.1 CI (master prompt §75–§76).
#
# Two jobs driven by a single workflow:
#   - ci : deterministic gate (install → typecheck → lint → unit tests).
#          Runs on every push to main and on every pull_request.
#          NEVER includes destructive DB scripts (§74).
#          Does NOT run `bun run build` — the sandbox uses `next dev -p 3000`
#          (build output is not what we verify here; type/lint/test is the gate).
#   - live-integration : runs ONLY on manual workflow_dispatch.
#          Runs the live gold-set tests if they exist.
#          Allows failure because external legal sources may be rate-limited,
#          blocked by Cloudflare, or temporarily down (§76).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Deterministic gate (typecheck · lint · unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

  # -----------------------------------------------------------------------
  # §76 — LIVE integration is a SEPARATE concern.
  # External legal sources (ARLIS, Datalex, ConCourt, HUDOC, web_search)
  # can be rate-limited, blocked by Cloudflare, or down at any moment.
  # They MUST NOT block every PR.
  # This job runs ONLY on manual dispatch (workflow_dispatch) and is
  # marked continue-on-error so an unstable source never fails the run.
  # -----------------------------------------------------------------------
  live-integration:
    name: Live gold-set (manual, may fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live gold-set tests (if present)
        run: bun test tests/live/ || true
        # tests/live/ does not exist yet in this repo. The `|| true` makes the
        # step a no-op pass when no live tests are present. When live tests are
        # added later they will be picked up automatically.

      - name: Note on HTTP gold-set harness
        run: |
          # The /api/test/gold-set and /api/test/resolution-gold-set routes
          # require a running dev server and are gated by LEGAL_QA_TOKEN in
          # production (§9-§10). They are intentionally NOT invoked from CI.
          echo "Live HTTP harness skipped — requires running dev server and QA token (§9-§10)."
